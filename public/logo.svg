<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="40%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="bridge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#sky)"/>

  <!-- Moon crescent -->
  <circle cx="400" cy="96" r="44" fill="url(#moon)"/>
  <circle cx="420" cy="76" r="38" fill="url(#sky)"/>

  <!-- Stars -->
  <circle cx="72" cy="64" r="6" fill="#c7d2fe" opacity="0.9"/>
  <circle cx="176" cy="44" r="4" fill="#c7d2fe" opacity="0.6"/>
  <circle cx="288" cy="80" r="5" fill="#c7d2fe" opacity="0.7"/>
  <circle cx="112" cy="136" r="3" fill="#c7d2fe" opacity="0.5"/>

  <!-- Water area -->
  <path d="M0 384 Q64 368 128 384 Q192 400 256 384 Q320 368 384 384 Q448 400 512 384 L512 512 Q512 512 400 512 L112 512 Q0 512 0 512 Z" fill="url(#water)" opacity="0.35"/>

  <!-- Tower left -->
  <rect x="128" y="152" width="16" height="208" rx="6" fill="url(#bridge)"/>
  <rect x="112" y="152" width="48" height="20" rx="6" fill="url(#bridge)"/>
  <rect x="116" y="200" width="40" height="12" rx="4" fill="#f59e0b" opacity="0.8"/>

  <!-- Tower right -->
  <rect x="368" y="152" width="16" height="208" rx="6" fill="url(#bridge)"/>
  <rect x="352" y="152" width="48" height="20" rx="6" fill="url(#bridge)"/>
  <rect x="356" y="200" width="40" height="12" rx="4" fill="#f59e0b" opacity="0.8"/>

  <!-- Road deck -->
  <rect x="40" y="336" width="432" height="20" rx="8" fill="url(#bridge)"/>

  <!-- Main cables -->
  <path d="M40 232 Q88 288 136 160" fill="none" stroke="#fbbf24" stroke-width="10" stroke-linecap="round"/>
  <path d="M136 160 Q256 272 376 160" fill="none" stroke="#fbbf24" stroke-width="10" stroke-linecap="round"/>
  <path d="M376 160 Q424 288 472 232" fill="none" stroke="#fbbf24" stroke-width="10" stroke-linecap="round"/>

  <!-- Vertical suspender cables -->
  <line x1="72" y1="252" x2="72" y2="336" stroke="#fcd34d" stroke-width="5" opacity="0.6"/>
  <line x1="104" y1="228" x2="104" y2="336" stroke="#fcd34d" stroke-width="5" opacity="0.6"/>
  <line x1="176" y1="188" x2="176" y2="336" stroke="#fcd34d" stroke-width="5" opacity="0.6"/>
  <line x1="216" y1="216" x2="216" y2="336" stroke="#fcd34d" stroke-width="5" opacity="0.6"/>
  <line x1="256" y1="232" x2="256" y2="336" stroke="#fcd34d" stroke-width="5" opacity="0.6"/>
  <line x1="296" y1="216" x2="296" y2="336" stroke="#fcd34d" stroke-width="5" opacity="0.6"/>
  <line x1="336" y1="188" x2="336" y2="336" stroke="#fcd34d" stroke-width="5" opacity="0.6"/>
  <line x1="408" y1="228" x2="408" y2="336" stroke="#fcd34d" stroke-width="5" opacity="0.6"/>
  <line x1="440" y1="252" x2="440" y2="336" stroke="#fcd34d" stroke-width="5" opacity="0.6"/>

  <!-- Water reflection -->
  <rect x="80" y="372" width="352" height="8" rx="4" fill="#fbbf24" opacity="0.12"/>
  <rect x="120" y="392" width="272" height="6" rx="3" fill="#fbbf24" opacity="0.08"/>
</svg>
